<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Model Builder</title>
  <link rel="stylesheet" href="framework/base.css">
  <link rel="stylesheet" href="framework/ui.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // collected for tests/ui/ui_check.py: script errors and console.error calls
    window.__errors = [];
    window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
    window.addEventListener("unhandledrejection", (e) => window.__errors.push("unhandled: " + String(e.reason && e.reason.message || e.reason)));
    const __ce = console.error;
    console.error = (...a) => { window.__errors.push(a.map(String).join(" ")); __ce.apply(console, a); };
  </script>
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
  </script>
</head>
<body>
  <header>
    <h1 title="Build 3D viewer models from STL files and bind them to ctrlX MOTION axes">3D Model Builder</h1>
    <span id="project-chip" class="chip" title="The project that is open">No project open</span>
    <span id="save-chip" class="chip" title="Changes are saved as soon as they are made">-</span>
    <span id="zone-chip" class="chip" title="Result of the zone check for a Cartesian kinematic">Zone: -</span>
    <span id="toolbar" class="btn-group"></span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="readonly-bar" class="readonly-bar" hidden></div>

  <main class="mb">
    <aside id="left" class="col"></aside>
    <section id="centre" class="col centre">
      <div id="stage" class="stage" title="3D preview: drag to orbit, right-drag or Shift-drag to pan, wheel to zoom"></div>
      <div id="stage-bar" class="stage-bar"></div>
    </section>
    <aside id="right" class="col"></aside>
  </main>
  <input id="file-input" type="file" accept=".stl,.STL" hidden title="Choose an STL file to upload">
  <script src="framework/ctrlx.js"></script>
  <script src="framework/ui.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
