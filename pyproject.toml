[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-builder"
version = "0.5.0"
description = "Build 3D viewer models from STL files and bind them to ctrlX MOTION axes"
requires-python = ">=3.10"
dependencies = [
    "ctrlx-datalayer<=3.6",
    "ctrlx-fbs"
]

[project.scripts]
app-main = "app.main:main"

[tool.setuptools]
packages = ["app"]
